<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Knowledge Studio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<!--
  KNOWLEDGE STUDIO · the Knowledge tab of Sabli's Mind Studio, round 2 (2026-10-29)
  ---------------------------------------------------------------------------------
  After the feature and strategy reviews: one primary action (Start interview on the topic that needs you most),
  no colour on text, the app's own Try your mind, one place to add work, depth from level only, This month cut.
  The head is a progress indicator: the mind's % and one segment per level (36), this month's in the field colour.
  Three variations of the same parts, each leading with something different (switch at the top, or #a #b #c):
    A  Next step         one card: the topic that needs you most, and Start interview
    B  Ranked            one list of every topic, the thin ones people ask about first, the top one opened
    C  Depth vs demand   a petal per topic: dark is how deep it goes, grey is how often people ask
  Any topic opens the same panel (the app's Sheet: 560px, from the bottom on phones).
  Tokens are the app's (globals.css); the field colour (Design, CATEGORY_SHADES) only on progress marks.
-->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap">
<style>
/* Layout: Studio header and tabs, the progress head, then a two-column grid whose lead card changes per variation. */
:root {
  --bg: #fafaf7; --surface: #ffffff; --subtle: #f2f2ee; --fg: #0b0b0b; --muted: #5c5c57; --faint: #6b6b65;
  --border: #e6e6e0; --border-strong: #c9c9c2; --off: #e2e1db; --petal: #e3e2dc; --scrim: rgba(11,11,11,.2);
  --btn: #0b0b0b; --btn-fg: #ffffff; --btn-hover: #2b2b29;
  --f1: #dc6b25; /* CATEGORY_SHADES.Design — progress marks only */
  --sans: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --ease: cubic-bezier(.22,1,.36,1);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121110; --surface: #191816; --subtle: #22201e; --fg: #eeece8; --muted: #a3a09a; --faint: #96938c;
  --border: #33302c; --border-strong: #4a4641; --off: #2c2a27; --petal: #3d3a35; --scrim: rgba(0,0,0,.55);
  --btn: #eeece8; --btn-fg: #121110; --btn-hover: #d6d3cd; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #121110; --surface: #191816; --subtle: #22201e; --fg: #eeece8; --muted: #a3a09a; --faint: #96938c;
  --border: #33302c; --border-strong: #4a4641; --off: #2c2a27; --petal: #3d3a35; --scrim: rgba(0,0,0,.55);
  --btn: #eeece8; --btn-fg: #121110; --btn-hover: #d6d3cd; color-scheme: dark }

* { box-sizing: border-box }
body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 var(--sans); -webkit-font-smoothing: antialiased }
button, input, textarea { font: inherit; color: inherit }
button { background: none; border: 0; padding: 0; margin: 0; cursor: pointer; text-align: left }
a { color: inherit; text-decoration: none }
:focus-visible { outline: 2px solid color-mix(in srgb, var(--fg) 30%, transparent); outline-offset: 2px }
h1, h2, h3, p { margin: 0 }
h1, h2 { text-wrap: balance }
p { text-wrap: pretty }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap }
.small { font-size: 13px } .muted { color: var(--muted) }
.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
@media (min-width: 760px) { .gutter { padding-left: max(40px, env(safe-area-inset-left, 0px)); padding-right: max(40px, env(safe-area-inset-right, 0px)) } }

/* Motion: one curve; shape first, content after; under 500ms */
@keyframes rise { from { opacity: 0; transform: translateY(8px); filter: blur(4px) } }
@keyframes pop { from { opacity: 0; transform: scale(.4) } }
@keyframes grow { from { transform: scaleX(0) } }
@keyframes growY { from { transform: scaleY(0) } }
@keyframes fade { from { opacity: 0 } }
@keyframes blink { 50% { opacity: 0 } }
.rise { animation: rise .45s var(--ease) backwards }

/* Prototype bar (not product) */
.proto { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding-block: 10px; border-bottom: 1px dashed var(--border-strong); font-size: 13px; color: var(--muted) }
.seg { display: inline-flex; gap: 2px; padding: 2px; border-radius: 999px; background: var(--subtle); max-width: 100%; overflow-x: auto; scrollbar-width: none }
.seg button { flex-shrink: 0; white-space: nowrap; min-height: 36px; padding: 0 14px; border-radius: 999px; font-size: 13px; color: var(--muted); transition: background-color .18s var(--ease), color .18s var(--ease) }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--fg) }

/* Studio header (the shell's pill tabs) */
.top { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 24px; padding-block: 12px; border-bottom: 1px solid var(--border) }
.brand { font-weight: 600 }
.tabs { display: flex; gap: 4px; overflow-x: auto; max-width: 100%; scrollbar-width: none }
.tab { flex-shrink: 0; min-height: 40px; padding: 0 14px; border-radius: 999px; font-size: 13px; font-weight: 500; color: var(--muted); display: inline-flex; align-items: center; transition: background-color .18s var(--ease), color .18s var(--ease) }
.tab:hover { background: var(--subtle) }
.tab[aria-current="page"] { background: var(--subtle); color: var(--fg) }

.page { max-width: 1120px; margin: 0 auto; padding-block: 32px 64px }
.h1 { font-size: 32px; font-weight: 600; letter-spacing: -.02em; line-height: 1.2 }

/* Progress head (after the progress indicator): the %, how it moved, one segment per level */
.prog { margin-bottom: 24px }
.prog-top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 24px }
.prog-num { display: flex; align-items: center; gap: 12px; flex-wrap: wrap }
.prog-num b { font-size: 32px; font-weight: 600; letter-spacing: -.02em; line-height: 1.2; font-variant-numeric: tabular-nums }
.delta { display: inline-flex; align-items: center; gap: 4px; min-height: 28px; padding: 0 10px; border: 1px solid var(--border-strong); border-radius: 999px; font-size: 13px; font-variant-numeric: tabular-nums }
.levels { display: grid; grid-template-columns: repeat(36, minmax(0, 1fr)); gap: 3px; height: 36px; margin-top: 16px }
.levels i { border-radius: 3px; background: var(--off); transform-origin: bottom; animation: growY .4s var(--ease) backwards }
.levels i.on { background: var(--fg) }
.levels i.new { background: var(--f1) }
@media (max-width: 640px) { .levels { gap: 2px; height: 28px } .levels i { border-radius: 2px } }

/* Cards: the dashboard's own (rounded-xl border bg-surface p-5 sm:p-6) */
.grid { display: grid; gap: 16px; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); align-items: start }
.stack { display: flex; flex-direction: column; gap: 16px; min-width: 0 }
@media (max-width: 900px) { .grid { grid-template-columns: minmax(0, 1fr) } }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 24px; min-width: 0 }
@media (max-width: 640px) { .card { padding: 20px } }
.c-head { display: flex; align-items: baseline; justify-content: space-between; gap: 4px 12px; flex-wrap: wrap }
.c-title { font-size: 16px; font-weight: 600 }
.quiet { display: inline-flex; align-items: center; gap: 6px; min-height: 40px; font-size: 13px; flex-shrink: 0 }
.quiet span { text-decoration: underline; text-underline-offset: 3px; transition: color .18s var(--ease) }
.quiet:hover span { color: var(--muted) }
.btn1 { min-height: 48px; padding: 0 20px; border-radius: 12px; background: var(--btn); color: var(--btn-fg); font-weight: 500; display: inline-flex; align-items: center; justify-content: center; gap: 8px; transition: background-color .18s var(--ease), transform .15s var(--ease) }
.btn1:hover { background: var(--btn-hover) }
.btn2 { min-height: 44px; padding: 0 16px; border: 1px solid var(--border-strong); border-radius: 12px; font-weight: 500; display: inline-flex; align-items: center; justify-content: center; gap: 8px; background: var(--surface); transition: background-color .18s var(--ease), transform .15s var(--ease) }
.btn2:hover { background: var(--subtle) }
.btn1:active, .btn2:active, .row:active { transform: scale(.97) }

/* Level squares (LevelSquares) */
.sq { display: inline-flex; gap: 3px; flex-shrink: 0 }
.sq i { width: 10px; height: 10px; border-radius: 2px; background: var(--off); animation: pop .3s var(--ease) backwards }
.sq i.on { background: var(--f1) }
.sq.s i { width: 8px; height: 8px; border-radius: 1.5px }
/* FillLine */
.fill { height: 6px; border-radius: 999px; background: var(--subtle); overflow: hidden }
.fill i { display: block; height: 100%; border-radius: 999px; background: var(--fg); transform-origin: left; animation: grow .45s var(--ease) .1s backwards }
/* A topic's depth as a small block of square dots: wider and more solid level by level */
.mass { display: grid; grid-template-columns: repeat(6, 4px); grid-auto-rows: 4px; gap: 2px; flex-shrink: 0 }
.mass i { width: 4px; height: 4px; border-radius: 1px; background: var(--fg); animation: pop .3s var(--ease) backwards }
.mass i.off { background: transparent }

/* Next step */
.next-card { display: flex; flex-direction: column; gap: 16px }
.h2 { font-size: 24px; font-weight: 600; letter-spacing: -.015em; line-height: 1.2 }
.next-meta { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--muted) }
.next-acts { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 20px }

/* Topic rows */
.rows { margin-top: 4px }
.row { width: 100%; display: flex; align-items: center; gap: 14px; min-height: 60px; padding: 10px 0; border-top: 1px solid var(--border); transition: transform .15s var(--ease) }
.row .nm { flex: 1; min-width: 0; line-height: 1.35 }
.row .nm small { display: block; font-size: 13px; color: var(--muted) }
.row .ask { flex: 0 0 120px; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums }
.row .ask .bar { width: 100%; height: 2px; border-radius: 2px; background: var(--subtle); overflow: hidden }
.row .ask .bar i { display: block; height: 100%; background: var(--fg); transform-origin: left; animation: grow .45s var(--ease) backwards }
.row:hover .nm > span { text-decoration: underline; text-underline-offset: 3px }
@media (max-width: 640px) { .row .ask { flex-basis: 48px } .row .ask .bar { display: none } }
.row.lead { flex-wrap: wrap; padding: 16px 0 20px }
.row.lead:hover .nm > span { text-decoration: none }
.row-lead-body { flex-basis: 100%; padding-left: 50px; display: flex; flex-direction: column; gap: 12px }
@media (max-width: 640px) { .row-lead-body { padding-left: 0 } }
.group-h { display: flex; align-items: center; gap: 10px; margin-top: 20px; padding-bottom: 6px; font-size: 13px; color: var(--muted) }

/* Depth vs demand (C, after the petal chart): dark inner petal = depth, grey outer petal = people asking */
.petals { position: relative; max-width: 440px; margin: 12px auto 0 }
.petals svg { display: block; width: 100%; height: auto; overflow: visible }
.pet { cursor: pointer; outline: none }
.pet path, .pet text { transition: opacity .2s var(--ease) }
.petals.has-on .pet:not(.on) path, .petals.has-on .pet:not(.on) text { opacity: .3 }
.pet .outer { fill: var(--petal); stroke: var(--petal); stroke-width: 8; stroke-linejoin: round }
.pet .inner { fill: var(--fg); stroke: var(--fg); stroke-width: 6; stroke-linejoin: round }
.pet:focus-visible .outer { stroke: var(--border-strong) }
.pet .n { font: 500 13px var(--sans); fill: var(--muted); text-anchor: middle; dominant-baseline: middle; font-variant-numeric: tabular-nums }
.pet .n.on-ink { fill: var(--btn-fg) }
.g-out, .g-in { transform-box: view-box; transform-origin: 200px 200px; animation: petal .5s var(--ease) backwards }
@keyframes petal { from { opacity: 0; transform: scale(.4) } }
.ptip { position: absolute; left: 0; top: 0; transform: translate(-50%, calc(-100% - 8px)); white-space: nowrap; background: var(--btn); color: var(--btn-fg); font-size: 13px; padding: 4px 10px; border-radius: 999px; opacity: 0; pointer-events: none; transition: opacity .2s var(--ease) }
.ptip.on { opacity: 1 }
.legend { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 20px; margin-top: 16px; font-size: 13px; color: var(--muted) }
.legend span { display: inline-flex; align-items: center; gap: 8px }
.legend i { width: 12px; height: 12px; border-radius: 3px; background: var(--fg) }
.legend i.g { background: var(--petal) }

/* Try your mind (TryCard) */
.try-lead { margin-top: 8px; font-size: 13px; color: var(--muted) }
.tries { display: flex; flex-direction: column; gap: 12px; margin-top: 16px }
.tries:empty { display: none }
.try { border: 1px solid var(--border); border-radius: 10px; padding: 16px; animation: rise .4s var(--ease) backwards }
.by { display: flex; align-items: center; gap: 8px; margin: 12px 0 6px; font-size: 13px; font-weight: 500 }
.by img { width: 24px; height: 24px; border-radius: 28%; object-fit: cover }
.dot { display: inline-block; width: 5px; height: 5px; background: currentColor; border-radius: 1px; margin-left: -5px; transform: translateY(2px) }
.thinking .dot { animation: blink 1s steps(1) infinite }
.verdicts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px }
.verdicts .btn2, .verdicts .btn1 { min-height: 40px; font-size: 13px; padding: 0 14px }
.rewrite { width: 100%; margin-top: 6px; min-height: 120px; border: 1px solid var(--border-strong); border-radius: 10px; background: var(--bg); padding: 12px; resize: vertical; line-height: 1.5 }
.box { margin-top: 16px; border: 1px solid var(--border-strong); border-radius: 16px; background: var(--surface); padding: 10px 10px 10px 14px; transition: border-color .2s var(--ease) }
.box:focus-within { border-color: var(--fg) }
.box textarea { width: 100%; border: 0; resize: none; background: transparent; outline: none; min-height: 48px; transition: min-height .3s var(--ease); line-height: 1.5 }
.box textarea:focus { min-height: 84px }
.box-bar { display: flex; align-items: center; justify-content: space-between; gap: 8px }
.hint { display: inline-flex; align-items: center; gap: 8px; min-height: 36px; padding: 0 12px; border-radius: 999px; background: var(--subtle); font-size: 13px; color: var(--muted); max-width: calc(100% - 52px); transition: background-color .18s var(--ease) }
.hint span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.hint:hover { background: var(--border) }
.send { width: 40px; height: 40px; border-radius: 999px; background: var(--btn); color: var(--btn-fg); display: inline-grid; place-items: center; flex-shrink: 0; transition: opacity .18s var(--ease), transform .15s var(--ease) }
.send:disabled { opacity: .3; cursor: default }

/* Your work (rows, one place to add) */
.drop { width: 100%; margin-top: 16px; min-height: 72px; border-radius: 12px; background: var(--subtle); display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 13px; color: var(--muted); text-align: center; padding: 12px; transition: background-color .2s var(--ease) }
.drop:hover, .drop.flash { background: var(--border) }
.work-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 52px; border-top: 1px solid var(--border) }
.work-row:first-child { border-top: 0 }
.work-row span:last-child { font-size: 13px; color: var(--muted); text-align: right }

/* Panel (Sheet) */
dialog.sheet { position: fixed; inset: 12px 12px 12px auto; margin: 0; width: min(560px, calc(100% - 24px)); max-width: none; max-height: none; height: auto; border: 0; border-radius: 16px; padding: 0; background: var(--surface); color: var(--fg); overflow-y: auto }
dialog.sheet::backdrop { background: var(--scrim) }
dialog.sheet[open] { animation: slide .4s var(--ease) backwards }
dialog.sheet[open]::backdrop { animation: fade .3s var(--ease) backwards }
dialog.sheet.closing { animation: slide-out .3s var(--ease) forwards }
dialog.sheet.closing::backdrop { animation: fade-out .3s var(--ease) forwards }
@keyframes slide { from { opacity: 0; transform: translateX(32px) } }
@keyframes slide-out { to { opacity: 0; transform: translateX(32px) } }
@keyframes fade-out { to { opacity: 0 } }
.sheet-in { padding: 24px; animation: rise .4s var(--ease) .12s backwards }
@media (max-width: 640px) {
  dialog.sheet { inset: auto 0 0 0; width: 100%; max-height: 88vh; border-radius: 20px 20px 0 0 }
  dialog.sheet[open] { animation-name: sheet-up } dialog.sheet.closing { animation-name: sheet-down }
  @keyframes sheet-up { from { transform: translateY(100%) } } @keyframes sheet-down { to { transform: translateY(100%) } }
  .sheet-in { padding: 20px 16px calc(32px + env(safe-area-inset-bottom, 0px)) }
}
.p-top { display: flex; align-items: center; justify-content: space-between; gap: 12px }
.x { width: 40px; height: 40px; border-radius: 10px; display: inline-grid; place-items: center; transition: background-color .18s var(--ease) }
.x:hover { background: var(--subtle) }
.shape { width: 100%; height: 96px; display: block; margin: 12px 0 }
.p-next { margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--border) }
.p-acts { display: flex; flex-direction: column; gap: 8px; margin-top: 20px }
.p-sect { margin-top: 28px; display: flex; align-items: baseline; justify-content: space-between; gap: 12px }
.toast { position: fixed; z-index: 30; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--btn); color: var(--btn-fg); padding: 10px 16px; border-radius: 999px; font-size: 13px; animation: rise .4s var(--ease) backwards; white-space: nowrap }

@media (prefers-reduced-motion: reduce) { *, *::before, *::backdrop { animation: none !important; transition: none !important } }
</style>
</head>
<body>

<div class="proto gutter" role="group" aria-label="Prototype">
  <span>Prototype · leads with</span>
  <div class="seg" id="vars">
    <button type="button" data-var="a" aria-pressed="true">A · Next step</button>
    <button type="button" data-var="b" aria-pressed="false">B · Ranked</button>
    <button type="button" data-var="c" aria-pressed="false">C · Depth vs demand</button>
  </div>
</div>

<header class="top gutter">
  <span class="brand">Mind Studio</span>
  <nav class="tabs" aria-label="Studio">
    <a href="#" class="tab">Your mind</a>
    <a href="#" class="tab" aria-current="page">Knowledge</a>
    <a href="#" class="tab">Challenges</a>
    <a href="#" class="tab">Earnings</a>
    <a href="#" class="tab">Insights</a>
  </nav>
</header>

<main class="gutter">
  <div class="page">
    <section class="prog rise" aria-labelledby="pg-title">
      <div class="prog-top">
        <div><h1 class="h1" id="pg-title">Knowledge</h1><p class="small muted" style="margin-top:4px">Design · 31 of 36 levels across 12 topics</p></div>
        <div class="prog-num"><b>86%</b><span class="delta" aria-label="Up 3 levels this month"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17L17 7M9 7h8v8"/></svg>3 levels</span><span class="small muted">this month</span></div>
      </div>
      <div class="levels" id="levels" role="img" aria-label="31 of 36 levels reached, 3 of them this month"></div>
    </section>
    <div id="view"></div>
  </div>
</main>

<dialog class="sheet" id="sheet" aria-labelledby="p-title"><div class="sheet-in" id="sheet-in"></div></dialog>

<script>

  }
  function renderTry() {
    var title = $("#tr-title"); if (!title) return;
    var tmp = document.createElement("div"); tmp.innerHTML = tryCard(); tmp.firstChild.style.animation = "none";
    title.closest(".card").replaceWith(tmp.firstChild); wireBox();
  }
  function wireBox() {
    var q = $("#q"), send = $("#send"); if (!q) return;
    q.addEventListener("input", function () { send.disabled = q.value.trim().length < 10; });
    q.addEventListener("keydown", function (e) { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send.click(); } });
    send.addEventListener("click", function () { var v = q.value.trim(); if (v.length < 10) return; ask(v, guess(v)); });
  }
  function guess(v) { v = v.toLowerCase(); return /churn|retention|leave|cancel/.test(v) ? "ret" : /experiment|growth|test/.test(v) ? "growth" : /hire|team/.test(v) ? "team" : "_"; }

  // Your work: one place to add, rows by topic, and how much of the mind has your work behind it
  function workCard() {
    var withWork = TOPICS.filter(function (t) { return t.work.length; }), rows = [];
    TOPICS.forEach(function (t) { t.work.forEach(function (w) { rows.push([w, t.label]); }); });
    return '<section class="card rise" style="animation-delay:160ms" aria-labelledby="wk-title"><div class="c-head"><h2 class="c-title" id="wk-title">Your work</h2><span class="small muted">Read for your mind, never shown to people</span></div>' +
      '<div style="margin-top:16px"><div class="fill"><i style="width:' + Math.round(withWork.length / TOPICS.length * 100) + '%"></i></div><p class="small muted" style="margin-top:8px">' + withWork.length + " of " + TOPICS.length + " topics have your work</p></div>" +
      '<div style="margin-top:8px">' + rows.slice(0, 4).map(function (r) { return '<div class="work-row"><span>' + esc(r[0]) + "</span><span>" + esc(r[1]) + "</span></div>"; }).join("") + "</div>" +
      '<button type="button" class="drop" id="drop" data-act="add">' + PLUS + "<span>Drop a file or paste a link. Your mind reads it and says what it found.</span></button></section>";
  }

  /* ------------------------------------------------------------------ *
   *  The three variations: the same parts, a different lead             *
   * ------------------------------------------------------------------ */
  var VARS = {
    a: function () { return '<div class="grid"><div class="stack">' + nextCard() + groupsCard() + '</div><div class="stack">' + tryCard() + workCard() + "</div></div>"; },
    b: function () { return '<div class="grid"><div class="stack">' + rankedCard() + '</div><div class="stack">' + tryCard() + workCard() + "</div></div>"; },
    c: function () { return '<div class="grid"><div class="stack">' + petalsCard() + workCard() + '</div><div class="stack">' + nextCard() + tryCard() + "</div></div>"; }
  };
  var current = "a";
  function show(v) {
    current = VARS[v] ? v : "a";
    document.querySelectorAll("#vars button").forEach(function (b) { b.setAttribute("aria-pressed", String(b.dataset.var === current)); });
    $("#view").innerHTML = VARS[current]();
    wireBox(); wirePetals();
    if (location.hash.slice(1) !== current) history.replaceState(null, "", "#" + current);
  }

  /* ------------------------------------------------------------------ *
   *  Panel                                                              *
   * ------------------------------------------------------------------ */
  var sheet = $("#sheet"), lastFocus = null;
  function openTopic(id) {
    var t = byId[id]; if (!t) return;
    lastFocus = document.activeElement;
    $("#sheet-in").innerHTML =
      '<div class="p-top"><span style="display:inline-flex;align-items:center;gap:10px">' + squares(t.level) + '<span class="small muted">' + LV[t.level] + " · level " + t.level + ' of 3</span></span>' +
      '<button type="button" class="x" data-act="close" aria-label="Close"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>' +
      '<canvas class="shape" aria-hidden="true"></canvas>' +
      '<h2 class="h2" id="p-title">' + esc(t.label) + '</h2><p class="small muted" style="margin-top:6px">' + people(t.asked) + "</p>" +
      '<div class="p-next"><p class="small muted">' + (t.next ? "To reach " + t.next.to : "At the deepest level") + '</p><p style="margin-top:2px">' + (t.next ? t.next.needs : "A new real case keeps it sharp.") + "</p></div>" +
      '<div class="p-acts"><a href="#interview" class="btn1" data-act="interview" data-id="' + t.id + '">Start interview</a>' +
      '<button type="button" class="btn2" data-act="offer">' + (t.offer ? "Edit what people can ask you for" : "Map something you deliver") + '</button><p class="small muted" style="text-align:center">About 5 minutes</p></div>' +
      '<div class="p-sect"><h3 class="c-title">Your work on it</h3><button type="button" class="quiet" data-act="add"><span>Add work</span></button></div>' +
      (t.work.length ? t.work.map(function (w) { return '<div class="work-row"><span>' + esc(w) + "</span><span></span></div>"; }).join("") : '<p class="small muted" style="margin-top:8px">Nothing yet. A piece of your work is what takes a topic to Deep.</p>');
    sheet.classList.remove("closing");
    if (!sheet.open) sheet.showModal();
    drawShape($(".shape", sheet), t.level, TOPICS.indexOf(t) + 3);
  }
  function closeSheet(after) {
    if (!sheet.open) { if (after) after(); return; }
    if (reduce) { sheet.close(); if (after) after(); return; }
    sheet.classList.add("closing");
    setTimeout(function () { sheet.classList.remove("closing"); sheet.close(); if (after) after(); }, 300);
  }
  sheet.addEventListener("close", function () { if (lastFocus && document.contains(lastFocus)) lastFocus.focus(); });
  sheet.addEventListener("cancel", function (e) { e.preventDefault(); closeSheet(); });
  sheet.addEventListener("click", function (e) { if (e.target === sheet) closeSheet(); });
  // the topic as a mass of square dots (after "Our values"): as wide and solid as its level
  function drawShape(cv, level, seed) {
    var w = cv.clientWidth, h = cv.clientHeight, dpr = Math.min(2, window.devicePixelRatio || 1);
    cv.width = w * dpr; cv.height = h * dpr;
    var ctx = cv.getContext("2d"); ctx.scale(dpr, dpr); ctx.fillStyle = cssVar("--fg");
    var s = level / 3, rnd = seeded(seed * 97), sp = 7, cols = Math.floor(w / sp), rows = Math.floor(h / sp), cells = [];
    for (var r = 0; r < rows; r++) for (var c = 0; c < cols; c++) {
      var xf = c / cols, yf = Math.abs(r / (rows - 1) - 0.5) * 2, edge = s * 0.9 - xf - yf * yf * 0.3, n = rnd();
      if (!(edge > 0 ? n < 0.97 : n < Math.max(0, 0.5 + edge * 3.4))) continue;
      var jit = edge > 0 ? 0 : Math.min(3, -edge * 10);
      cells.push({ x: c * sp + (rnd() - 0.5) * jit, y: r * sp + (rnd() - 0.5) * jit, z: edge > 0 ? 4 : 3, k: xf + rnd() * 0.12 });
    }
    cells.sort(function (a, b) { return a.k - b.k; });
    var start = performance.now() + 120, dur = reduce ? 0 : 480;
    (function paint(now) {
      var p = dur ? Math.max(0, Math.min(1, (now - start) / dur)) : 1, upto = Math.floor(cells.length * (1 - Math.pow(1 - p, 3)));
      ctx.clearRect(0, 0, w, h);
      for (var i = 0; i < upto; i++) ctx.fillRect(cells[i].x, cells[i].y, cells[i].z, cells[i].z);
      if (p < 1) requestAnimationFrame(paint);
    })(performance.now());
  }
  function toast(msg) {
    var el = document.createElement("div"); el.className = "toast"; el.setAttribute("role", "status"); el.textContent = msg;
    document.body.appendChild(el); setTimeout(function () { el.remove(); }, 2200);
  }

  /* ------------------------------------------------------------------ *
   *  Events                                                             *
   * ------------------------------------------------------------------ */
  document.addEventListener("click", function (e) {
    var b = e.target.closest("[data-var],[data-open],[data-act],[data-hint],[data-me],[data-edit],[data-save],[data-cancel]");
    if (!b) return;
    if (b.tagName === "A" || b.closest("a.pet")) e.preventDefault();
    if (b.dataset.var) { show(b.dataset.var); return; }
    if (b.dataset.open) { openTopic(b.dataset.open); return; }
    if (b.dataset.hint) { var tt = byId[b.dataset.hint]; ask("What would you do first about " + tt.label.toLowerCase() + "?", tt.id); return; }
    if (b.dataset.me) { tries[+b.dataset.me].verdict = "me"; renderTry(); return; }
    if (b.dataset.edit) { tries[+b.dataset.edit].state = "editing"; renderTry(); return; }
    if (b.dataset.cancel) { tries[+b.dataset.cancel].state = "done"; renderTry(); return; }
    if (b.dataset.save) { var i = +b.dataset.save, tr = tries[i], v = $("#rw" + i).value.trim(); if (v.length < 10) return; tr.mine = v; tr.verdict = "mine"; tr.state = "done"; renderTry(); return; }
    var act = b.dataset.act;
    if (act === "close") closeSheet();
    else if (act === "interview") toast("The interview opens on " + byId[b.dataset.id].label);
    else if (act === "offer") toast("Opens What people can ask you for");
    else if (act === "add") {
      // one place to add work: the panel hands over to Your work's drop
      closeSheet(function () { var d = $("#drop"); if (!d) return; d.scrollIntoView({ behavior: reduce ? "auto" : "smooth", block: "center" }); d.classList.add("flash"); d.focus({ preventScroll: true }); setTimeout(function () { d.classList.remove("flash"); }, 700); });
    }
  });
  addEventListener("hashchange", function () { show(location.hash.slice(1)); });
  show(location.hash.slice(1) || "a");
})();
</script>
</body>
</html>
